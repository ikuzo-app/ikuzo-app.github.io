<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}" />
  </head>
  <body>
    <div class="page-shell{% if page.page_shell_class %} {{ page.page_shell_class }}{% endif %}">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-lockup">
            <img
              class="brand-logo"
              src="{{ '/assets/ikuzo_logo.png' | relative_url }}"
              alt="{{ site.title }} logo"
            />
            <span class="brand-text">{{ site.title }}</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          {% if page.url == '/' %}
            <a class="nav-button" href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
          {% else %}
            <a class="nav-button nav-button-secondary" href="{{ '/' | relative_url }}">Home</a>
          {% endif %}
        </nav>
      </header>

      {{ content }}

      <footer class="site-footer">
        <p>&copy; 2026 {{ site.title }}. All rights reserved.</p>
        {% if page.url == '/privacy/' %}
          <a href="{{ '/' | relative_url }}">Back to Home</a>
        {% else %}
          <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        {% endif %}
      </footer>
    </div>
  </body>
</html>
